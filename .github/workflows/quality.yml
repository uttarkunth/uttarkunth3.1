name: Uttarkunth Quality Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: uttarkunth-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Unit and regression tests
        run: npm test

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
